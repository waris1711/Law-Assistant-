name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps

      - name: Setup Capacitor / Android
        run: npx cap sync @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Run cap sync android
        run: npx cap sync android || echo "No Capacitor installed, skipping sync"

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "APK directory found"
          else
            echo "No APK directory found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          
