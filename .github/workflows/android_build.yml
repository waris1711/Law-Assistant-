name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps
          npm install -D @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Setup Capacitor Configuration
        run: |
          # Purani broken ts config hata kar pure JSON config banayein
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.lawassistant.app",
            "appName": "LawAssistant",
            "webDir": "dist"
          }
          EOF

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "APK directory found"
          else
            echo "No APK directory found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          
